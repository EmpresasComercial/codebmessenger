<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Business Messenger</title>
    <link rel="icon" type="image/jpeg" href="/logo_bussiness_messeger.jpg?v=3" />
    <link rel="apple-touch-icon" href="/logo_bussiness_messeger.jpg?v=3" />
    <link rel="preload" as="image" href="/logo_bussiness_messeger.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Força theme-color branco imediatamente, sobrepõe qualquer cache
      (function() {
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach(function(m) { m.content = '#ffffff'; });
      })();
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPwaPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) { reg.update(); });
          });
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
              console.log('Service Worker registrado:', reg);
            })
            .catch(err => console.error('SW erro:', err));
        });
      }
    </script>
  </body>
</html>
